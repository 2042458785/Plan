# 全局配置
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    include            /etc/nginx/mime.types;
    default_type       application/octet-stream;
    sendfile           on;
    keepalive_timeout  65;
    charset            utf-8;
    gzip               on;
    client_max_body_size 6m;

    # ============================================
    # 后端接口（/api/）
    # ============================================
    server {
        listen 127.0.0.1:18091;

        location /api/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $http_host;
        }
    }

    # ============================================
    # 前台商城（/）和公网入口（80 端口）
    # ============================================
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html/dist;
        index index.html;

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control no-cache;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 将其他路径交给各自的本机 server，保留完整请求路径。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://127.0.0.1:18091;
        }

        location = /quick {
            return 301 /quick/;
        }

        location /quick/ {
            proxy_pass http://127.0.0.1:18092;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:18093;
        }
    }

    # ============================================
    # 前台快速商城（/quick/）
    # ============================================
    server {
        listen 127.0.0.1:18092;
        absolute_redirect off;

        location = /quick/index.html {
            alias /usr/share/nginx/html/quick/index.html;
            add_header Cache-Control no-cache;
        }

        location ^~ /quick/ {
            alias /usr/share/nginx/html/quick/;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }

    # ============================================
    # 后台前端（/admin/）
    # ============================================
    server {
        listen 127.0.0.1:18093;
        absolute_redirect off;

        location = /admin/index.html {
            alias /usr/share/nginx/html/dist_end/index.html;
            add_header Cache-Control no-cache;
        }

        location ^~ /admin/ {
            alias /usr/share/nginx/html/dist_end/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }
    }
}
